name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 14 3 * *"
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Download fresh public data before publishing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cu-bison-partnership

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            cu-bison-partnership/requirements.txt
            cu-bison-partnership/constraints.txt

      - name: Install Python packages
        run: pip install -r requirements.txt -c constraints.txt

      - name: Regression checks
        run: python -m unittest discover -s tests -v

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"

      - name: Download and process public data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_data)
        run: python scripts/build_data.py

      - name: Refuse to publish preview data
        run: python scripts/check_data.py

      - name: Render the site
        run: quarto render

      - name: Save the refreshed data to the repository
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_data)
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "Refresh public data [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cu-bison-partnership/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4